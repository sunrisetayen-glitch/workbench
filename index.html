<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ff5a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="灵感台" />
    <meta name="description" content="自媒体灵感工作台" />
    <title>灵感工作台</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./assets/icons/icon-512.png" />
    <link rel="icon" href="./assets/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      :root{--accent:#ff5a5f;--bg:#f6f7fb}
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%}
      body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
      .skeleton{display:flex;height:100%}
      .sk-left{width:320px;background:#fff;border-right:1px solid #ececf0;padding:12px;display:flex;flex-direction:column;gap:10px}
      .sk-row{height:30px;display:flex;gap:6px}
      .sk-tab{flex:1;background:#e8e9ed;border-radius:8px}
      .sk-block{flex:1;background:#e8e9ed;border-radius:10px;animation:pulse 1.4s ease-in-out infinite}
      .sk-right{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px}
      .sk-card2{background:#e8e9ed;border-radius:16px;height:130px;animation:pulse 1.4s ease-in-out infinite}
      .sk-card2:nth-child(2){animation-delay:.15s}
      .sk-card2:nth-child(3){animation-delay:.3s}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}
      .app-ready .skeleton{display:none}
      @media (max-width:767px){.sk-left{display:none}.sk-right{display:block}}
    </style>

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="skeleton">
      <div class="sk-left">
        <div class="sk-row"><div class="sk-tab"></div><div class="sk-tab"></div></div>
        <div class="sk-block"></div>
      </div>
      <div class="sk-right">
        <div class="sk-card2"></div><div class="sk-card2"></div><div class="sk-card2"></div>
      </div>
    </div>

    <div class="app-layout" id="app-layout">

      <!-- ====== 左侧栏 ====== -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-logo">✨ 灵感工作台</h2>
          <button class="sidebar-toggle" id="sidebar-toggle" title="收起侧栏">◀</button>
        </div>

        <!-- 顶层两个模块 tab -->
        <nav class="module-tabs" id="module-tabs">
          <button class="module-tab module-tab--active" data-module="bookmarks"><span class="tab-emoji">📌</span><span class="tab-text"> 收藏夹</span></button>
          <button class="module-tab" data-module="notes"><span class="tab-emoji">💡</span><span class="tab-text"> 灵感碎片</span></button>
        </nav>

        <!-- ====== 模块 A：收藏夹 ====== -->
        <div class="module-panel module-panel--active" id="module-bookmarks">
          <div class="search-wrap">
            <input id="search" class="search-input" type="search" placeholder="搜索标题 / 链接 / 标签 / 笔记" />
          </div>
          <div id="chips" class="chips"></div>
          <div class="tagcloud-row">
            <span class="tagcloud-label">标签云</span>
            <div id="tagcloud" class="tagcloud"></div>
          </div>
          <div class="grid-meta"><span id="count">0 / 0</span></div>
          <section id="grid" class="grid"></section>
        </div>

        <!-- ====== 模块 B：灵感碎片 ====== -->
        <div class="module-panel" id="module-notes">
          <nav class="hub-tabs" id="hub-tabs">
            <button class="hub-tab hub-tab--active" data-tab="capture">📝 记录</button>
            <button class="hub-tab" data-tab="compile">🗂 整理</button>
            <button class="hub-tab" data-tab="query">🔍 提取</button>
            <button class="hub-tab" data-tab="analyze">🌐 分析</button>
          </nav>

          <div class="hub-panel hub-panel--active" id="panel-capture">
            <textarea id="capture-input" class="hub-textarea" placeholder="记下碎片想法、粘贴链接……&#10;例如：短视频开头怎么抓人？试试前3秒反差法" rows="4"></textarea>
            <button id="capture-btn" class="hub-btn hub-btn--primary">记录</button>
            <div class="hub-inbox" id="inbox-list"></div>
          </div>

          <div class="hub-panel" id="panel-compile">
            <p class="hub-hint">将未归类的碎片笔记按话题自动合并</p>
            <button id="compile-btn" class="hub-btn hub-btn--primary">自动整理</button>
            <div class="hub-topics" id="topics-list"></div>
          </div>

          <div class="hub-panel" id="panel-query">
            <input id="query-input" class="hub-input" type="text" placeholder="输入话题关键词搜索……" />
            <button id="query-btn" class="hub-btn hub-btn--primary">搜索笔记</button>
            <div class="hub-results" id="query-results"></div>
          </div>

          <div class="hub-panel" id="panel-analyze">
            <p class="hub-hint">选择一个话题，查看各平台参考内容</p>
            <select id="analyze-topic-select" class="hub-select"><option value="">-- 选择话题 --</option></select>
            <button id="analyze-btn" class="hub-btn hub-btn--primary">开始分析</button>
            <div class="hub-results" id="analyze-results"></div>
          </div>

          <div class="sidebar-stats" id="sidebar-stats">
            <span>📊 笔记 <strong id="stat-total">0</strong></span>
            <span>📥 待整理 <strong id="stat-inbox">0</strong></span>
          </div>
        </div>
      </aside>

      <!-- ====== 右侧预览区 ====== -->
      <main class="main-area" id="main-area">
        <div class="preview-placeholder" id="preview-placeholder">
          <div class="preview-icon">👆</div>
          <p class="preview-text">点击左侧收藏或灵感碎片查看详情</p>
        </div>
        <div class="preview-content" id="preview-content"></div>
      </main>

    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="bn-item bn-item--active" id="bn-bookmarks">
        <span class="bn-icon">📌</span><span class="bn-label">收藏夹</span>
      </button>
      <button class="bn-item" id="bn-notes">
        <span class="bn-icon">💡</span><span class="bn-label">灵感碎片</span>
      </button>
      <button class="bn-item" id="add-btn-nav">
        <span class="bn-icon bn-icon--add">＋</span><span class="bn-label">添加</span>
      </button>
    </nav>

    <button id="add-btn" class="fab" aria-label="添加收藏">＋</button>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
